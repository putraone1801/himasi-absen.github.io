<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi HIMASI</title>
  
  <!-- Favicon HIMASI -->
  <link rel="icon" href="https://i.imgur.com/pwcKXen.png" type="image/png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f7fb;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- =====================================================================
       GANTI URL DI BAWAH DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
       (Format: https://script.google.com/macros/s/.../exec)
       
       Dengan cara ini, peringatan "Aplikasi ini dibuat oleh pengguna lain"
       TIDAK AKAN MUNCUL sama sekali di ponsel maupun desktop!
       ===================================================================== -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxOqrk5PO54_fldJo9Are9Ez3ke0NFcU9zbksSgAzDNEnr05-6wC5Vn44lXIgFpfjHP/exec" 
    allow="geolocation; camera"
    allowfullscreen
  ></iframe>

</body>
</html>
